name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyserial pyinstaller

      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name QuadFC-GCS main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuadFC-GCS-windows-x64
          path: dist/QuadFC-GCS.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuadFC-GCS.exe
