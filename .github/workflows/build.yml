name: Build Windows EXE (Electron — web GCS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (webapp + Electron toolchain)
        working-directory: webapp
        run: npm install --no-audit --no-fund
        shell: bash

      - name: Static export of the web GCS (out/)
        working-directory: webapp
        env:
          NEXT_OUTPUT: export
        run: npx next build
        shell: bash

      - name: Package portable EXE
        working-directory: webapp
        run: npx electron-builder --win portable --config electron-builder.yml
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuadFC-GCS-windows
          path: webapp/dist-desktop/*.exe

      - name: Publish release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: webapp/dist-desktop/QuadFC-GCS.exe
